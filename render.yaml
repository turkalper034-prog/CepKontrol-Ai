services:
  - type: web
    name: cepkontrol-ai-demo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: /tmp/cepkontrol-demo.db
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
